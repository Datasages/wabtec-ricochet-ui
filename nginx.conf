server {
	listen 80;

	# TLS terminates in front of this container, so nginx sees plain HTTP on
	# port 80. An absolute redirect would send the browser to http://; a
	# relative Location keeps whatever scheme and host it arrived on.
	absolute_redirect off;

	location / {
		return 301 /ricochet-ui/;
	}

	# `root`, not `alias`. This is the whole bug that shipped in 1.0.3.
	#
	# The bundle lives at /usr/share/nginx/html/ricochet-ui/. `root` APPENDS
	# the request URI to it, so /ricochet-ui/static/js/main.js resolves to
	# /usr/share/nginx/html/ricochet-ui/static/js/main.js — correct. `alias`
	# REPLACES the matched location prefix, so the same request resolved to
	# /usr/share/nginx/html/static/js/main.js, which does not exist.
	#
	# The try_files fallback was rewritten the same way, which is why nothing
	# 404'd and why the symptom was so confusing: /ricochet-ui/index.html
	# became /usr/share/nginx/html/index.html, the base image's stock
	# "Welcome to nginx!" page. The application's own index.html was never
	# reachable. Every request — the document itself, not only its assets —
	# returned that welcome page with a 200.
	#
	# A status-code check cannot see any of this. scripts/verify-image.sh
	# asserts what was actually served, and both workflows run it.
	location /ricochet-ui/ {
		root /usr/share/nginx/html;
		try_files $uri $uri/ /ricochet-ui/index.html;
	}
}
