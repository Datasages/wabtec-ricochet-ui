name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  # The image name lives here rather than in the environment: it is this repo's
  # identity, so it is versioned and shows up in a diff.
  #
  # There is deliberately NO registry variable. Docker Hub is the default
  # registry and must not be named as `index.docker.io` on login-action: the
  # docker CLI normalises an empty address -- and the spelling `docker.io` -- to
  # the credential key `https://index.docker.io/v1/`, but stores
  # `index.docker.io` verbatim, while buildx looks the push target up under the
  # normalised key. That one spelling logs in successfully and then finds no
  # credential for the push, and Docker Hub reports the result in a way that
  # reads like a token permissions problem. Leave it unnamed. Any other registry
  # must be named. (Cost this project five release runs in collins-strolr-api.)
  IMAGE_NAME: ricochet-ui

jobs:
  # One image per version serves every railroad in dev, prod and dr: it has no
  # configuration to differ by (vault decision
  # 2026-10-04-ricochet-ui-zero-config-image.md). Tags before 2.0.0 were
  # `amtk-<version>` builds with the railroad baked in.
  publish:
    runs-on: ubuntu-latest

    # Appropriate here and nowhere else in this repo: this job consumes a deploy
    # secret, and a tag push requires write access so it cannot come from a fork.
    #
    # ⚠️ Fork-safety is NOT what bounds this secret. The environment's deployment
    # branch policy is, and it must be set to a custom rule matching tag `v*`
    # with no branch rule. Left at "all branches", ANY job in this repo that
    # names this environment can draw DOCKERHUB_TOKEN -- including a
    # pull_request-triggered one on a same-repo branch.
    #
    # It does NOT follow that the tagged commit reached main -- verify that
    # yourself before tagging, which is why the full build and test run again
    # below rather than being inherited from ci.yml.
    environment: Datasages Development

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Fail in seconds with a readable message rather than after the install,
      # test and version steps have spent their minutes, only to die at
      # docker/login-action with "Username and password required". The secret is
      # per-repository even though the environment shares a name with the one in
      # collins-strolr-api, so a new repo starts without it.
      - name: The deploy credential must be present
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::DOCKERHUB_TOKEN is not set on the Datasages Development environment of this repository. Environment secrets do not carry across repositories."
            exit 1
          fi
          if [ -z "$USERNAME" ]; then
            echo "::error::DOCKERHUB_USERNAME is not set. It is expected to be a Datasages organization variable."
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Test
        run: npm test -- --watchAll=false
        env:
          CI: 'true'

      # The tag is the source of truth for the version, and package.json must
      # agree, so the image cannot be labelled differently from the bundle
      # inside it. Without this the version is whatever the tagger typed.
      #
      # The `v` is stripped here and the bare result is the image tag. Git tags
      # carry the v by convention; image tags do not.
      - name: Tag and package.json version must agree
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          echo "tag=$tag package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Record the build date
        id: builddate
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # BUILD_ID carries the commit into the built bundle and the image labels.
      # The images built by hand before this pipeline existed carry "unknown",
      # which is why identifying what a deployed tag contained meant guessing.
      # ONE build, loaded locally, verified, then pushed as those exact bytes.
      #
      # An earlier revision built twice — once to verify, once to publish —
      # joined only by an assumption that the second would be a cache hit.
      # Nothing enforced it: no cache was declared, `npm ci` reaches the
      # network, and a miss would publish an artifact nothing had verified.
      # The duplicated build-args block was the worse half, since changing one
      # copy and not the other makes the guard vacuous with no signal at all —
      # the exact failure shape this workflow now exists to prevent.
      #
      # Verifying BEFORE the push, rather than after, means a broken image is
      # never published rather than published and then diagnosed.
      #
      # ⚠️ TRADE-OFF, recorded here so it is decided rather than rediscovered:
      # pushing with `docker push` loses the SLSA provenance attestation
      # (`attest type=provenance,mode=max`) that build-push-action adds on its
      # own push. Accepted, because the property it buys back is the one 1.0.3
      # lacked — the published bytes are provably the bytes that passed the
      # check. Restoring provenance without reopening that gap is a follow-up,
      # not a reason to go back to two builds.
      - name: Build the image and load it for verification
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          build-args: |
            BUILD_ID=${{ github.sha }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.builddate.outputs.date }}
            VERSION=${{ steps.version.outputs.version }}

      # Image ref arrives as env, not interpolated into the script, for the
      # same reason the summary step below does it: VERSION derives from the
      # git refname, which may legally contain `$`, backticks, `;` and `|`.
      - name: The image must serve the application before it is published
        env:
          IMAGE_REF: ${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
        run: ./scripts/verify-image.sh "$IMAGE_REF"

      - name: Publish the verified image
        env:
          IMAGE_REF: ${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
        run: docker push "$IMAGE_REF"

      # Values arrive as env, not as ${{ }} interpolated into the script.
      # VERSION derives from the tag name, and a git refname may legally contain
      # `$`, backticks, `;` and `|` -- interpolated, those are parsed by bash;
      # passed as env they are inert data.
      - name: Record what was published
        env:
          IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          TAG: ${{ steps.version.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`docker.io/$IMAGE:$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Built from \`$COMMIT\`." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pin this exact tag in the Terraform. No \`latest\` is published." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The tag is MUTABLE: no tag ruleset protects \`v*\` here, and Docker Hub tags are overwritable, so a re-cut tag republishes over this one. Pin the digest instead if that matters." >> "$GITHUB_STEP_SUMMARY"
