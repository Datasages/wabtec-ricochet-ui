name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No `environment:` here, deliberately. This job builds and runs code from the
# branch under test, so an environment would expose its secrets to PR-authored
# content. Publishing happens only in release.yml, on a tag.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ENVIRONMENT: prod

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # The SAME matrix as release.yml, deliberately, and this is an invariant
    # rather than a convention: release.yml promises that adding a railroad is
    # one more entry, and if that entry is not also here, CI validates a build
    # configuration the release then publishes unvalidated. Keeping the two
    # literally identical is what makes the promise safe. `marks` travels with
    # `scac` because it is a function of it, and the mark list is a live
    # business value -- AMTK's gained CDTX/IDTX/WDTX at some point.
    strategy:
      matrix:
        include:
          - scac: amtk
            marks: AMTK,CDTX,IDTX,WDTX

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: '20'
          cache: npm

      # ci, not install: it installs exactly the lockfile and fails if
      # package.json and package-lock.json disagree, which is the property that
      # makes a build reproducible.
      - name: Install dependencies
        run: npm ci

      # Its own step rather than relying on the build. react-scripts lints
      # through eslint-webpack-plugin, which only sees modules in the webpack
      # graph -- the two test files are not, so `react-app/jest` would never be
      # exercised. --max-warnings 0 because eslint exits 0 on warnings and would
      # otherwise gate nothing.
      - name: Lint
        run: npm run lint -- --max-warnings 0

      # CI=true makes react-scripts run once and exit rather than watching.
      # --passWithNoTests is NOT set: this repo has real tests
      # (useCookies.test.ts, registrationPoll.test.ts) and they cover the cookie
      # handling the F8/F9 work touched, so a suite that silently vanished
      # should fail the build rather than pass it.
      - name: Test
        run: npm test -- --watchAll=false
        env:
          CI: 'true'

      # The image build below compiles the app itself, so this step is not a
      # duplicate: it is the one that fails with a readable error. A type error
      # inside `docker build` surfaces as a layer failure several hundred lines
      # into buildx output.
      #
      # .env is required by the React build and is generated from .env.template
      # at image build time. Here the template stands in unsubstituted, which is
      # enough to typecheck and bundle.
      - name: Copy the env template for the build
        run: cp .env.template .env

      - name: Build
        run: npm run build

      # Builds the image without publishing, so a broken Dockerfile surfaces on
      # the pull request. release.yml runs only on a tag, and without this the
      # first exercise of the Dockerfile would be a tag that then has to be
      # deleted and re-cut.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build the image without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          # Loaded into the local daemon rather than discarded, so the step
          # below can actually run it. Building an image and never starting it
          # is what let 1.0.3 ship serving no JavaScript.
          load: true
          tags: ricochet-ui:ci
          build-args: |
            SCAC=${{ matrix.scac }}
            ENVIRONMENT=${{ env.ENVIRONMENT }}
            MARK_LIST=${{ matrix.marks }}
            BUILD_ID=${{ github.sha }}

      # Shared with release.yml rather than written twice. The published image
      # is the one that matters, and a tag need not come from a commit that
      # passed this workflow — so the check has to live somewhere both can
      # call. The script carries the explanation of what it asserts and why.
      - name: The image must serve the application
        run: ./scripts/verify-image.sh ricochet-ui:ci
