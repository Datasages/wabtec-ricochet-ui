name: supply-chain-audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, because a new advisory against an unchanged lockfile or base image
  # is otherwise invisible until the next commit. A failed scheduled run is
  # reported by GitHub's own notification.
  schedule:
    - cron: '43 6 * * 1'
  workflow_dispatch:

# No `environment:` on any job: both run code from the branch under test.
permissions:
  contents: read

jobs:
  osv-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # BLOCKING. Scans the full resolved tree in package-lock.json and fails on
      # any advisory not listed, with a reason and an expiry, in
      # osv-scanner.toml. Pinned by digest so the gate does not vary run to run.
      - name: Scan dependencies
        run: |
          docker run --rm -v "$PWD:/src:ro" \
            ghcr.io/google/osv-scanner:v2.6.0@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa \
            scan source --config=/src/osv-scanner.toml --lockfile=/src/package-lock.json

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Built as ci.yml builds it, never pushed. AMTK is the only railroad in
      # the ci.yml/release.yml matrix, and the scanned layers (the nginx base
      # and its Alpine packages) do not vary by railroad, so one build covers
      # every image the release publishes.
      - name: Build the image without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ricochet-ui:scan
          build-args: |
            SCAC=amtk
            ENVIRONMENT=prod
            MARK_LIST=AMTK,CDTX,IDTX,WDTX
            BUILD_ID=${{ github.sha }}

      # BLOCKING on any fixable HIGH/CRITICAL not listed in .trivyignore.yaml.
      # The digest-pinned image rather than aquasecurity/trivy-action, whose
      # tags were a supply-chain target: a digest cannot be repointed.
      - name: Scan the image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -v "$PWD:/src:ro" \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed \
            --ignorefile /src/.trivyignore.yaml ricochet-ui:scan
