# Known advisories the supply-chain audit tolerates, each with a reason and an
# expiry. Everything else a scan reports fails the build.
#
# Every entry is react-scripts 5.0.1 build or dev-server tooling, none of it in
# the production bundle or the image. Two groups, named in each reason:
#
#  - webpack-dev-server 4, fixed only in 5. react-scripts 5.0.1 is the final
#    Create React App release and passes webpack-dev-server options that 5
#    removed (onBeforeSetupMiddleware, onAfterSetupMiddleware), so `npm start`
#    fails schema validation under 5.
#  - NO FIX: no fixed release exists.
#
# Migrating off react-scripts (e.g. to Vite) clears every entry. The expiry is a deadline, not a hope: on that
# date the audit turns red until the migration lands or each entry is re-argued
# here.
#
# Regenerate after a dependency change by scanning and keeping only what is
# still reported. Never add an entry to silence a finding a version bump or an
# `overrides` entry in package.json would fix.

