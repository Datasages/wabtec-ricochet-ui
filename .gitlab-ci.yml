# =============================================================================
# GitLab CI/CD Pipeline for wabtec-ricochet-ui
#
# One image serves every railroad and environment (vault decision
# 2026-10-04-ricochet-ui-zero-config-image.md), so there is one build, published
# on a version tag with the same bare tag Docker Hub carries, and no `latest`.
#
# The image is built here only on a `v*` tag. Merge requests and main run the
# lint, tests and React build; the Dockerfile and scripts/verify-image.sh are
# exercised before a tag by GitHub's ci.yml.
# =============================================================================

image: node:20-alpine

variables:
  DOCKER_HOST: tcp://docker:2375/
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  IMAGE_NAME: ricochet-ui

stages:
  - test
  - build
  - docker-build
  - release

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - node_modules/

# =============================================================================
# Test Stage
# =============================================================================

lint:
  stage: test
  script:
    - npm ci
    - npm run lint || true
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_TAG

unit-tests:
  stage: test
  script:
    - npm ci
    - npm run test -- --watchAll=false --passWithNoTests
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_TAG

# =============================================================================
# Build Verification Stage
# =============================================================================

build-verification:
  stage: build
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - build/
    expire_in: 1 hour
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_TAG

# =============================================================================
# Docker Build Stage
# =============================================================================

docker-build:
  stage: docker-build
  image: docker:27
  services:
    - name: docker:dind
      command: ["--tls=false"]
  before_script:
    - mkdir -p ~/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64)\"}}}" > ~/.docker/config.json
  script:
    # The git tag carries the `v`; the image tag does not, matching Docker Hub,
    # so one release has one name in both registries.
    - VERSION="${CI_COMMIT_TAG#v}"
    - BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
    - |
      docker build \
        --build-arg BUILD_DATE="${BUILD_DATE}" \
        --build-arg GIT_COMMIT="${CI_COMMIT_SHA}" \
        --build-arg VERSION="${VERSION}" \
        --build-arg BUILD_ID="${CI_COMMIT_SHORT_SHA}" \
        -t ${CI_REGISTRY_IMAGE}:${VERSION} \
        .
    - docker push ${CI_REGISTRY_IMAGE}:${VERSION}
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

# =============================================================================
# Release Stage
# =============================================================================

create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
    - echo "Image ${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG#v} serves every railroad and environment"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: "Release $CI_COMMIT_TAG of Ricochet UI"
  # The same rule as docker-build, so a release never names an image that was
  # not built.
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
